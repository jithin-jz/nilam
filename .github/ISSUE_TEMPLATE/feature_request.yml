name: Feature request
description: Suggest a new card, a setting, or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or annoyance behind the request, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: >
        Two constraints worth knowing before you write: the app adds no
        dependencies beyond what ships with Windows, and it is meant to stay
        small and idle. Requests that fit inside those are the easiest to say
        yes to.
